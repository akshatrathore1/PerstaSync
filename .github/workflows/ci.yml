name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Acquire pinned dependencies
        run: go mod download
      - name: Verify module checksums
        run: go mod verify
      - name: Check formatting
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) {
            $unformatted
            exit 1
          }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Linux test suite
        if: runner.os == 'Linux'
        run: go test ./... -count=1
      - name: Windows portable tests
        if: runner.os == 'Windows'
        run: go test ./... -count=1 -skip '^TestReplaceRoundTrip$'
